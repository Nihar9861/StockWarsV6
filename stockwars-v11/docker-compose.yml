services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: stockwars, POSTGRES_PASSWORD: stockwars, POSTGRES_DB: stockwars}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U stockwars"], interval: 5s, retries: 10}
  redis:
    image: redis:7
  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}, redis: {condition: service_started}}
    restart: unless-stopped
volumes: {pgdata: {}}
